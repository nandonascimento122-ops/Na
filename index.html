<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Click Links</title>
<style>
:root{--bg:#f2f5f7;--fg:#14232b;--muted:#5b6c75;--card:#fff;--line:#d3dde3;--acc:#0a7d8c;--accfg:#fff;--ok:#1b7a3d;--bad:#b4331a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--fg:#e6eef2;--muted:#8fa3ad;--card:#16262e;--line:#263943;--acc:#3ec3d3;--accfg:#04252b;--ok:#6fd18f;--bad:#f08a72}}
:root[data-theme="dark"]{--bg:#0f1a20;--fg:#e6eef2;--muted:#8fa3ad;--card:#16262e;--line:#263943;--acc:#3ec3d3;--accfg:#04252b;--ok:#6fd18f;--bad:#f08a72}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif}
main{max-width:600px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.8rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{margin:0 0 18px;color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.item{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.item span{width:1.6em;text-align:right;color:var(--muted);flex:none}
input{width:100%;padding:11px 12px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;min-width:0}
input.bad{border-color:var(--bad)}
button{font:inherit;font-weight:700;padding:10px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accfg);cursor:pointer}
button.g{background:transparent;color:var(--acc)}
button:active{transform:scale(.97)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.item button{flex:none;padding:10px 12px}
.opts{display:flex;align-items:center;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.opts input{width:90px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#st{margin-top:12px;min-height:1.5em;color:var(--muted);font-weight:600}
#st.ok{color:var(--ok)}#st.bad{color:var(--bad)}
.note{font-size:.88rem;color:var(--muted);margin:14px 0 0}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>
</head>
<body>
<main>
<h1>Auto Click Links</h1>
<p class="sub">Cole até 10 links e abra todos automaticamente.</p>
<div class="box">
<div id="list"></div>
<div class="opts">
<label for="sec">Intervalo entre links (segundos)</label>
<input id="sec" type="number" min="2" value="5">
</div>
<div class="row">
<button id="all" type="button">Abrir todos de uma vez</button>
<button id="seq" type="button" class="g">Abrir um por um</button>
<button id="clr" type="button" class="g">Limpar</button>
</div>
<div id="st" role="status"></div>
<p class="note">O navegador pode bloquear pop-ups. Se aparecer o aviso de bloqueio na barra de endereço, escolha permitir para esta página e clique de novo. Os links ficam salvos neste navegador.</p>
</div>
</main>
<script>
(function(){
var MAX = 10;
var KEY = 'acl-links';
var list = document.getElementById('list');
var st = document.getElementById('st');
var currentTimeout = null;
var countdownTimer = null;
var isRunning = false;
var inputs = [];

function say(t, c) {
  st.textContent = t;
  st.className = c || '';
}

function norm(u) {
  u = (u || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try {
    var x = new URL(u);
    return /^https?:$/.test(x.protocol) && x.hostname.includes('.') ? x.href : '';
  } catch (e) {
    return '';
  }
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      l: inputs.map(function(i){ return i.value; }),
      s: document.getElementById('sec').value
    }));
  } catch (e) {}
}

function load() {
  try {
    var d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d) {
      inputs.forEach(function(i, n){
        i.value = (d.l && d.l[n]) || '';
      });
      if (d.s) document.getElementById('sec').value = d.s;
    }
  } catch (e) {}
}

function openOne(u) {
  var w = window.open(u, '_blank', 'noopener');
  return !!w;
}

for (var i = 0; i < MAX; i++) {
  (function(n) {
    var row = document.createElement('div');
    row.className = 'item';
    
    var num = document.createElement('span');
    num.textContent = (n + 1) + '.';
    
    var inp = document.createElement('input');
    inp.placeholder = 'Link ' + (n + 1) + ' (https://...)';
    inp.setAttribute('aria-label', 'Link ' + (n + 1));
    inp.inputMode = 'url';
    inp.oninput = function() {
      inp.classList.remove('bad');
      save();
    };
    
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'g';
    b.textContent = 'Abrir';
    b.onclick = function() {
      var u = norm(inp.value);
      if (!u) {
        inp.classList.add('bad');
        say('Link ' + (n + 1) + ' inválido.', 'bad');
        return;
      }
      var aberto = openOne(u);
      say(aberto ? 'Link ' + (n + 1) + ' aberto.' : 'Pop-up bloqueado. Permita e tente de novo.', aberto ? '' : 'bad');
    };
    
    row.appendChild(num);
    row.appendChild(inp);
    row.appendChild(b);
    list.appendChild(row);
    inputs.push(inp);
  })(i);
}

load();
document.getElementById('sec').oninput = save;

function collect() {
  var out = [];
  inputs.forEach(function(inp) {
    if (!inp.value.trim()) return;
    var u = norm(inp.value);
    if (u) out.push(u);
    else inp.classList.add('bad');
  });
  return out;
}

function stopSeq() {
  isRunning = false;
  if (currentTimeout) {
    clearTimeout(currentTimeout);
    currentTimeout = null;
  }
  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
  document.getElementById('seq').textContent = 'Abrir um por um';
}

document.getElementById('all').onclick = function() {
  stopSeq();
  var urls = collect();
  if (!urls.length) {
    say('Cole pelo menos um link válido.', 'bad');
    return;
  }
  var ok = 0;
  urls.forEach(function(u){
    if (openOne(u)) ok++;
  });
  if (ok === urls.length) {
    say(ok + ' link(s) abertos.', 'ok');
  } else {
    say('Abriu ' + ok + ' de ' + urls.length + '. Permita pop-ups.', 'bad');
  }
};

document.getElementById('seq').onclick = function() {
  if (isRunning) {
    stopSeq();
    say('Sequência interrompida.');
    return;
  }
  var urls = collect();
  if (!urls.length) {
    say('Cole pelo menos um link válido.', 'bad');
    return;
  }
  var secs = Math.max(2, parseInt(document.getElementById('sec').value, 10) || 5);
  var idx = 0;
  
  isRunning = true;
  this.textContent = 'Parar';
  
  function openNext() {
    if (!isRunning) return;
    if (idx >= urls.length) {
      stopSeq();
      say('Concluído: ' + urls.length + ' link(s) abertos.', 'ok');
      return;
    }
    if (!openOne(urls[idx])) {
      stopSeq();
      say('Pop-up bloqueado no link ' + (idx + 1) + '. Permita pop-ups.', 'bad');
      return;
    }
    idx++;
    if (idx < urls.length) {
      var restante = secs;
      say('Link ' + idx + '/' + urls.length + ' aberto. Próximo em ' + restante + 's');
      countdownTimer = setInterval(function() {
        if (!isRunning) {
          clearInterval(countdownTimer);
          return;
        }
        restante--;
        if (restante > 0) {
          say('Link ' + idx + '/' + urls.length + ' aberto. Próximo em ' + restante + 's');
        } else {
          clearInterval(countdownTimer);
          openNext();
        }
      }, 1000);
    } else {
      openNext();
    }
  }
  openNext();
};

document.getElementById('clr').onclick = function() {
  stopSeq();
  inputs.forEach(function(i){
    i.value = '';
    i.classList.remove('bad');
  });
  save();
  say('Lista limpa.');
};
})();
</script>
</body>
</html>
